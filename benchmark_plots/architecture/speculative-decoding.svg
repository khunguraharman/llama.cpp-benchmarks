<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc"><title id="title">Speculative decoding</title><desc id="desc">A draft model proposes sat, on, the. A target model verifies all draft positions in one pass. In this example all three tokens are accepted.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#16705c"/></marker></defs><style>text{font-family:'DM Sans',Arial,sans-serif;fill:#283531}.title{font-family:'Space Grotesk',Arial,sans-serif;font-weight:600;fill:#1c3028}.muted{fill:#68756f}.white{fill:white}.edge{fill:none;stroke:#16705c;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.dash{stroke-dasharray:10 10}</style><rect width="1536" height="1024" fill="white"/><text x="768" y="85" text-anchor="middle" dominant-baseline="middle" font-size="70" font-weight="500" class="title">Speculative decoding</text><rect x="65" y="210" width="300" height="125" rx="20" fill="#edf5f0" stroke="#d3e2d9" stroke-width="2.5"/><text x="215.0" y="272.5" text-anchor="middle" dominant-baseline="middle" font-size="46" font-weight="600" class="">The cat</text><rect x="475" y="210" width="270" height="125" rx="20" fill="#edf5f0" stroke="#d3e2d9" stroke-width="2.5"/><text x="610.0" y="272.5" text-anchor="middle" dominant-baseline="middle" font-size="40" font-weight="600" class="">Draft model</text><path d="M365 272H475" class="edge"/><path d="M745 272H845" class="edge"/><rect x="855" y="225" width="180" height="95" rx="20" fill="#eab091" stroke="#eab091" stroke-width="2.5"/><text x="945.0" y="272.5" text-anchor="middle" dominant-baseline="middle" font-size="46" font-weight="600" class="">sat</text><rect x="1055" y="225" width="180" height="95" rx="20" fill="#eab091" stroke="#eab091" stroke-width="2.5"/><text x="1145.0" y="272.5" text-anchor="middle" dominant-baseline="middle" font-size="46" font-weight="600" class="">on</text><rect x="1255" y="225" width="180" height="95" rx="20" fill="#eab091" stroke="#eab091" stroke-width="2.5"/><text x="1345.0" y="272.5" text-anchor="middle" dominant-baseline="middle" font-size="46" font-weight="600" class="">the</text><text x="1145" y="370" text-anchor="middle" dominant-baseline="middle" font-size="33" font-weight="500" class="muted">Propose several tokens</text><path d="M1145 410V480" class="edge"/><rect x="545" y="490" width="890" height="170" rx="20" fill="#16705c" stroke="#16705c" stroke-width="2.5"/><text x="990.0" y="575.0" text-anchor="middle" dominant-baseline="middle" font-size="34" font-weight="600" class=""></text><text x="990" y="545" text-anchor="middle" dominant-baseline="middle" font-size="51" font-weight="600" class="white">Target model</text><text x="990" y="610" text-anchor="middle" dominant-baseline="middle" font-size="31" font-weight="500" class="white">Verify all draft positions in one pass</text><path d="M990 675V735" class="edge"/><rect x="600" y="750" width="235" height="95" rx="20" fill="#e3f0e7" stroke="#d3e2d9" stroke-width="2.5"/><text x="717.5" y="797.5" text-anchor="middle" dominant-baseline="middle" font-size="43" font-weight="600" class="">sat ✓</text><rect x="865" y="750" width="235" height="95" rx="20" fill="#e3f0e7" stroke="#d3e2d9" stroke-width="2.5"/><text x="982.5" y="797.5" text-anchor="middle" dominant-baseline="middle" font-size="43" font-weight="600" class="">on ✓</text><rect x="1130" y="750" width="235" height="95" rx="20" fill="#e3f0e7" stroke="#d3e2d9" stroke-width="2.5"/><text x="1247.5" y="797.5" text-anchor="middle" dominant-baseline="middle" font-size="43" font-weight="600" class="">the ✓</text><text x="990" y="885" text-anchor="middle" dominant-baseline="middle" font-size="34" font-weight="500" class="muted">Accepted tokens</text><text x="768" y="945" text-anchor="middle" dominant-baseline="middle" font-size="36" font-weight="500" class="title">Example: all draft tokens accepted</text><text x="768" y="995" text-anchor="middle" dominant-baseline="middle" font-size="25" font-weight="500" class="muted">If a token is rejected, keep the accepted prefix and correct at that position.</text></svg>